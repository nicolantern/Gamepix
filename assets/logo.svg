<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="'Trebuchet MS', system-ui, sans-serif">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a93"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9af7ff"/>
      <stop offset="1" stop-color="#37c6e9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- arcade cabinet badge -->
  <g filter="url(#glow)">
    <rect x="170" y="20" width="180" height="120" rx="18" fill="none" stroke="url(#cyan)" stroke-width="5"/>
    <!-- joystick -->
    <line x1="225" y1="115" x2="225" y2="70" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="225" cy="64" r="11" fill="url(#pink)"/>
    <!-- buttons -->
    <circle cx="285" cy="80" r="10" fill="url(#pink)"/>
    <circle cx="312" cy="98" r="10" fill="url(#cyan)"/>
    <circle cx="285" cy="110" r="10" fill="url(#cyan)"/>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-weight="800" filter="url(#glow)">
    <text x="260" y="218" font-size="74" letter-spacing="2" fill="url(#pink)">MINI GAMES</text>
  </g>
  <text x="260" y="270" text-anchor="middle" font-size="34" font-weight="700"
        letter-spacing="14" fill="url(#cyan)">A R C A D E</text>
</svg>
