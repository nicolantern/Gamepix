<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="'Trebuchet MS', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9af7ff"/>
      <stop offset="0.5" stop-color="#37c6e9"/>
      <stop offset="1" stop-color="#9b5de5"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9af7ff"/>
      <stop offset="0.55" stop-color="#37c6e9"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#9af7ff"/>
      <stop offset="0.7" stop-color="#37c6e9"/>
      <stop offset="1" stop-color="#13243f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="12" y="12" width="536" height="356" rx="24" fill="#0b0b18" stroke="#22304d" stroke-width="2"/>

  <!-- faint dotted tech grid -->
  <g fill="#1c2740">
    <g>
      <circle cx="60"  cy="60" r="1.6"/><circle cx="110" cy="60" r="1.6"/><circle cx="160" cy="60" r="1.6"/>
      <circle cx="400" cy="60" r="1.6"/><circle cx="450" cy="60" r="1.6"/><circle cx="500" cy="60" r="1.6"/>
      <circle cx="60"  cy="320" r="1.6"/><circle cx="110" cy="320" r="1.6"/><circle cx="160" cy="320" r="1.6"/>
      <circle cx="400" cy="320" r="1.6"/><circle cx="450" cy="320" r="1.6"/><circle cx="500" cy="320" r="1.6"/>
    </g>
  </g>

  <!-- emblem centered at (280,128) -->
  <g>
    <!-- outer orbital arcs -->
    <g fill="none" stroke="url(#neon)" stroke-linecap="round" filter="url(#glow)">
      <circle cx="280" cy="128" r="92" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.6"/>
      <path d="M280 28 a100 100 0 0 1 86 50" stroke-width="3"/>
      <path d="M280 228 a100 100 0 0 1 -86 -50" stroke-width="3"/>
      <path d="M188 100 a96 96 0 0 0 -6 40" stroke-width="3" stroke="#e94560"/>
      <path d="M372 156 a96 96 0 0 0 6 -40" stroke-width="3" stroke="#e94560"/>
    </g>
    <!-- orbital nodes -->
    <g fill="#9af7ff" filter="url(#glow)">
      <circle cx="366" cy="78" r="4"/><circle cx="194" cy="178" r="4"/>
    </g>
    <g fill="#e94560" filter="url(#glow)">
      <circle cx="182" cy="140" r="4"/><circle cx="378" cy="116" r="4"/>
    </g>

    <!-- hex core glow -->
    <g filter="url(#bigglow)" opacity="0.8">
      <polygon points="280,58 340,93 340,163 280,198 220,163 220,93" fill="#37c6e9"/>
    </g>
    <!-- hex frame (double) -->
    <polygon points="280,58 340,93 340,163 280,198 220,163 220,93" fill="#0b0b18" stroke="url(#neon)" stroke-width="4"/>
    <polygon points="280,72 328,100 328,156 280,184 232,156 232,100" fill="none" stroke="#9b5de5" stroke-width="1.5" opacity="0.8"/>

    <!-- inner core -->
    <circle cx="280" cy="128" r="30" fill="url(#core)"/>
    <!-- pixel/play motif: a chunky play triangle made of blocks -->
    <g fill="#0b0b18">
      <rect x="270" y="110" width="9" height="9"/>
      <rect x="270" y="119" width="9" height="9"/>
      <rect x="270" y="128" width="9" height="9"/>
      <rect x="270" y="137" width="9" height="9"/>
      <rect x="279" y="119" width="9" height="9"/>
      <rect x="279" y="128" width="9" height="9"/>
      <rect x="288" y="128" width="9" height="9"/>
    </g>
    <!-- corner ticks on the hex -->
    <g stroke="#ffd23f" stroke-width="2.5" filter="url(#glow)">
      <path d="M280 58 v-10" stroke-linecap="round"/>
      <path d="M340 93 l9 -5" stroke-linecap="round"/>
      <path d="M340 163 l9 5" stroke-linecap="round"/>
      <path d="M280 198 v10" stroke-linecap="round"/>
      <path d="M220 163 l-9 5" stroke-linecap="round"/>
      <path d="M220 93 l-9 -5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <g filter="url(#glow)">
    <text x="280" y="296" text-anchor="middle" font-size="74" font-weight="800"
          letter-spacing="6" fill="url(#word)" stroke="#0a1830" stroke-width="2"
          paint-order="stroke" style="font-style:italic">GAMEPIX</text>
  </g>
  <text x="277" y="296" text-anchor="middle" font-size="74" font-weight="800" letter-spacing="6"
        fill="#e94560" opacity="0.3" style="font-style:italic">GAMEPIX</text>
  <text x="283" y="296" text-anchor="middle" font-size="74" font-weight="800" letter-spacing="6"
        fill="#37c6e9" opacity="0.3" style="font-style:italic">GAMEPIX</text>

  <!-- tagline -->
  <text x="280" y="330" text-anchor="middle" font-size="15" font-weight="700"
        letter-spacing="16" fill="#9af7ff" opacity="0.85">A R C A D E</text>
</svg>
