<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamepix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="intro-overlay">
    <div class="intro-by">by PixelForge Studios</div>
    <img class="intro-logo" src="assets/logo.svg" alt="Gamepix" />
    <div class="intro-skip">click to skip</div>
  </div>
  <header>
    <h1>Gamepix</h1>
    <div class="header-controls">
      <button id="mute-button" aria-label="Toggle music">&#9834;</button>
      <button id="back-button" hidden>&larr; Back</button>
    </div>
  </header>
  <main>
    <div id="menu-area">
    <div id="speaker-bar" aria-hidden="true"></div>
    <div id="menu">
      <button class="menu-btn" data-game="snake">Snake</button>
      <button class="menu-btn" data-game="pong">Pong</button>
      <button class="menu-btn" data-game="tictactoe">Tic-Tac-Toe</button>
      <button class="menu-btn" data-game="memory">Memory Match</button>
      <button class="menu-btn" data-game="flappy">Flappy Bird</button>
      <button class="menu-btn" data-game="breakout">Breakout</button>
      <button class="menu-btn" data-game="2048">2048</button>
      <button class="menu-btn" data-game="whack">Whack-a-Mole</button>
      <button class="menu-btn" data-game="dino">Dino Run</button>
      <button class="menu-btn" data-game="tetris">Tetris</button>
      <button class="menu-btn" data-game="invaders">Space Invaders</button>
      <button class="menu-btn" data-game="asteroids">Asteroids</button>
      <button class="menu-btn" data-game="pacman">Pac-Man</button>
      <button class="menu-btn" data-game="frogger">Frogger</button>
      <button class="menu-btn" data-game="doodle">Doodle Jump</button>
      <button class="menu-btn" data-game="towerdef">Tower Defense</button>
    </div>
    </div>
    <div id="game-container"></div>
  </main>
  <script src="games/audio.js"></script>
  <script src="games/speakers.js"></script>
  <script src="games/controls.js"></script>
  <script src="games/snake.js"></script>
  <script src="games/pong.js"></script>
  <script src="games/tictactoe.js"></script>
  <script src="games/memory.js"></script>
  <script src="games/flappy.js"></script>
  <script src="games/breakout.js"></script>
  <script src="games/g2048.js"></script>
  <script src="games/whack.js"></script>
  <script src="games/dino.js"></script>
  <script src="games/tetris.js"></script>
  <script src="games/invaders.js"></script>
  <script src="games/asteroids.js"></script>
  <script src="games/pacman.js"></script>
  <script src="games/frogger.js"></script>
  <script src="games/doodle.js"></script>
  <script src="games/towerdef.js"></script>
  <script src="games/descriptions.js"></script>
  <script src="games/pagination.js"></script>
  <script src="main.js"></script>
</body>
</html>
